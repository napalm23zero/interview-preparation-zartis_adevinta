services:
  # The pinned platform keeps the Flutter toolchain consistent on Apple Silicon.
  mobile:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    networks:
    - zartis
    init: true
    ports:
    - ${DEV_BIND_ADDRESS:?}:${MOBILE_WEB_HOST_PORT:?}:${MOBILE_WEB_PORT:?}
    platform: linux/amd64
    profiles:
    - mobile
    working_dir: /workspace
    volumes:
    - ../..:/workspace
    - flutter-pub-cache:/root/.pub-cache
    entrypoint:
    - /bin/sh
    - -c
    command:
    - flutter pub get && (flutter run -d web-server --web-hostname 127.0.0.1 --web-port 3002 &); exec dart run tool/dev_proxy.dart
    environment:
      MOBILE_WEB_PORT: ${MOBILE_WEB_PORT:?}
      BACKEND_PORT: ${BACKEND_PORT:?}
      TZ: UTC
      LANG: C.UTF-8
networks:
  zartis:
    name: zartis
    external: true
volumes:
  flutter-pub-cache:
    external: true
    name: zartis_flutter-pub-cache
