services:
  # The gateway routes explicitly configured local or deterministic generation requests.
  ai-gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
      target: dev
    networks:
    - zartis
    init: true
    ports:
    - ${DEV_BIND_ADDRESS:?}:${AI_GATEWAY_HOST_PORT:?}:${AI_GATEWAY_PORT:?}
    profiles:
    - apps
    working_dir: /workspace
    volumes:
    - ../..:/workspace
    - application-logs:/var/log/zartis
    command:
    - sh
    - -c
    - exec node gateway/server.js
    environment:
      PORT: ${AI_GATEWAY_PORT:?}
      AI_GATEWAY_MODE: ${AI_GATEWAY_MODE:-deterministic}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      QDRANT_URL: http://qdrant:${QDRANT_HTTP_PORT:?}
      TZ: UTC
      LANG: C.UTF-8
networks:
  zartis:
    name: zartis
    external: true
volumes:
  application-logs:
    external: true
    name: zartis_application-logs
