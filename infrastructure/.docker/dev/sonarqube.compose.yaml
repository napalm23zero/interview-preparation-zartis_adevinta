include:
- sonar-postgres.compose.yaml
services:
  # Code quality server keeps its own PostgreSQL database; project data is not mixed with marketplace data.
  sonarqube:
    build:
      context: ./sonarqube
      dockerfile: Dockerfile
    networks:
    - zartis
    init: true
    ports:
    - ${DEV_BIND_ADDRESS:?}:${SONARQUBE_HOST_PORT:?}:${SONARQUBE_PORT:?}
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-postgres:${SONAR_POSTGRES_PORT:?}/${SONAR_DB:?}
      SONAR_JDBC_USERNAME: ${SONAR_DB_USER:?}
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?}
      SONAR_WEB_PORT: ${SONARQUBE_PORT:?}
      TZ: UTC
      LANG: C.UTF-8
    depends_on:
      sonar-postgres:
        condition: service_healthy
    volumes:
    - sonarqube-data:/opt/sonarqube/data
    - sonarqube-extensions:/opt/sonarqube/extensions
    - sonarqube-logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc: 8192
networks:
  zartis:
    name: zartis
    external: true
volumes:
  sonarqube-data:
    external: true
    name: zartis_sonarqube-data
  sonarqube-extensions:
    external: true
    name: zartis_sonarqube-extensions
  sonarqube-logs:
    external: true
    name: zartis_sonarqube-logs
