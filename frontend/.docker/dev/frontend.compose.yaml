services:
  # The web client shares the API gateway; the dark side likes one origin.
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    networks:
    - zartis
    init: true
    ports:
    - ${DEV_BIND_ADDRESS:?}:${FRONTEND_HOST_PORT:?}:${FRONTEND_PORT:?}
    profiles:
    - apps
    working_dir: /workspace
    volumes:
    - ../..:/workspace
    - frontend-node-modules:/workspace/node_modules
    - application-logs:/var/log/zartis
    command:
    - sh
    - -c
    - npm ci --no-audit --no-fund && exec npm run dev -- --port "$$PORT"
    environment:
      PORT: ${FRONTEND_PORT:?}
      API_TARGET: http://backend:${BACKEND_PORT:?}
      TZ: UTC
      LANG: C.UTF-8
networks:
  zartis:
    name: zartis
    external: true
volumes:
  frontend-node-modules:
    external: true
    name: zartis_frontend-node-modules
  application-logs:
    external: true
    name: zartis_application-logs
