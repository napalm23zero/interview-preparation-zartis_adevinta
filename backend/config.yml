# Local feature switches and service locations are substituted from .env-dev at startup.
migrationsEnabled: true
migrationContexts: dev
identityIssuer: "http://identity:${IDENTITY_PORT}/realms/loopmarket-dev"
sessionsEnabled: true
redisUrl: "redis://${REDIS_HOST}:${REDIS_PORT}"
demoUsersEnabled: true
identityAdminUser: "${IDENTITY_ADMIN_USER}"
identityAdminPassword: "${IDENTITY_ADMIN_PASSWORD}"

server:
  rootPath: /api/*
  applicationConnectors:
    - type: http
      port: 8080
  adminConnectors:
    - type: http
      port: 8081
      bindHost: 127.0.0.1

database:
  # UTC keeps MySQL DATETIME values aligned with Java Instant audit fields.
  driverClass: com.mysql.cj.jdbc.Driver
  url: "jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?connectTimeout=5000&socketTimeout=5000"
  user: "${MYSQL_USER}"
  password: "${MYSQL_PASSWORD}"
  initialSize: 1
  minSize: 1
  maxSize: 5
  validationQuery: SELECT 1
  properties:
    hibernate.jdbc.time_zone: UTC
    hibernate.hbm2ddl.auto: none
