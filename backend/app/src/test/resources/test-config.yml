# In-memory database keeps API tests isolated from Docker and disposable development data.
server:
  rootPath: /api/*
  applicationConnectors:
    - type: http
      port: 0
  adminConnectors:
    - type: http
      port: 0
      bindHost: 127.0.0.1

database:
  driverClass: org.h2.Driver
  url: jdbc:h2:mem:loopmarket;DB_CLOSE_DELAY=-1
  user: sa
  password: ''
  initialSize: 1
  minSize: 1
  maxSize: 2
  validationQuery: SELECT 1
  properties:
    hibernate.hbm2ddl.auto: create
