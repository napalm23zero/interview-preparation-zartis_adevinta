          description: Not found
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    put:
      summary: Update person
      description: Administrator only.
      operationId: updatePerson
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PersonInput"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Person"
        '404':
          description: Not found
        '409':
          description: Conflict
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    delete:
      summary: Soft-delete person
      description: Administrator only.
      operationId: deletePerson
      security:
      - sessionBearer: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
