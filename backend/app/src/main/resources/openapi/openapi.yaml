---
openapi: 3.0.3
info:
  title: LoopMarket API
  version: 0.1.0
  description: Development API. Marketplace workflows and integrations are still in
    progress. API errors use application/problem+json; validation errors include an
    errors array with field names and messages.
servers:
- url: "/api"
paths:
  "/catalog":
    get:
      summary: Search published listings
      operationId: searchCatalog
      description: Returns only published, non-deleted listings. Filters use exact matches except text, which searches titles and descriptions. Results use offset pagination ordered by creation time descending and ID ascending; concurrent changes can shift pages.
      parameters:
      - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, default: 10}, description: Capped at 50}
      - {name: text, in: query, schema: {type: string}}
      - {name: category, in: query, schema: {type: string, enum: [OTHER, ELECTRONICS, HOME, FASHION, SPORTS, BOOKS]}}
      - {name: condition, in: query, schema: {type: string}}
      - {name: city, in: query, schema: {type: string}}
      - {name: minPrice, in: query, schema: {type: number, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01}}
      - {name: maxPrice, in: query, schema: {type: number, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01}}
      responses:
        '200':
          description: Page of public listings
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/PublicListingPage"}
        '400':
          description: Invalid filters or pagination
          content:
            application/problem+json:
              schema: {"$ref": "#/components/schemas/Problem"}
  "/catalog/{id}":
    get:
      summary: Read a published listing
      operationId: getCatalogListing
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Public listing
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/PublicListing"}
        '404':
          description: Listing is unavailable
  "/catalog/{listingId}/photo":
    get:
      summary: Read the validated photo of a published listing
      operationId: getCatalogPhoto
      parameters:
      - {name: listingId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Validated image
          content:
            image/png: {schema: {type: string, format: binary}}
            image/jpeg: {schema: {type: string, format: binary}}
        '404':
          description: Listing or photo is unavailable
  "/users/me":
    get:
      summary: Read the current user's safe profile
      operationId: getCurrentUser
      security:
      - sessionBearer: []
      responses:
        '200':
          description: Current user ID, display name and role
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/CurrentUser"}
        '401': {description: Session is missing or invalid}
  "/users/me/listings":
    get:
      summary: List the current seller's listings
      operationId: getSellerListings
      security:
      - sessionBearer: []
      parameters:
      - {name: status, in: query, schema: {type: string, enum: [DRAFT, PUBLISHED, ARCHIVED]}}
      - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
      - {name: size, in: query, schema: {type: integer, minimum: 1, default: 10}, description: Capped at 50}
      responses:
        '200':
          description: Paginated owner-scoped listings
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/SellerListingPage"}
        '400': {description: Invalid status or pagination}
        '401': {description: Session is missing or invalid}
  "/users/me/listings/{listingId}":
    get:
      summary: Read an owned listing, including a private draft
      operationId: getSellerListing
      security:
      - sessionBearer: []
      parameters:
      - {name: listingId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Owner-scoped listing
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Listing"}
        '401': {description: Session is missing or invalid}
        '404': {description: Listing is missing or belongs to another seller}
  "/users/me/listings/{listingId}/interests":
    get:
      summary: Read buyer interest for an owned listing
      operationId: getSellerInterests
      security:
      - sessionBearer: []
      parameters:
      - {name: listingId, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Buyer display names and interest timestamps
          content:
            application/json:
              schema:
                type: array
                items: {"$ref": "#/components/schemas/SellerInterest"}
        '401': {description: Session is missing or invalid}
        '404': {description: Listing is missing or belongs to another seller}
  "/hello":
    get:
      summary: Return a greeting
      operationId: sayHello
      responses:
        '200':
          description: Greeting returned
  "/sessions":
    post:
      summary: Authenticate with the development identity provider
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Login"
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          description: Invalid credentials
        '403':
          description: No local account
        '503':
          description: Identity or session service unavailable
    delete:
      summary: Revoke the current session
      description: A 503 means revocation could not be confirmed; the client may retry.
      operationId: deleteSession
      security:
      - sessionBearer: []
      responses:
        '204':
          description: Session revoked
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/persons":
    get:
      summary: List persons
      description: Administrator only.
      operationId: listPerson
      security:
      - sessionBearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: Page returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Person"
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                    format: int64
        '400':
          description: Invalid page
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    post:
      summary: Create person
      description: Administrator only.
      operationId: createPerson
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PersonInput"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Person"
        '409':
          description: Conflict
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/persons/{id}":
    parameters:
