      summary: List persons
      description: Administrator only.
      operationId: listPerson
      security:
      - sessionBearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: Page returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Person"
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                    format: int64
        '400':
          description: Invalid page
        '401':
          description: Session missing or invalid
