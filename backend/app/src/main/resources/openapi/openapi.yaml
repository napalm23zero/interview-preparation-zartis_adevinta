---
openapi: 3.0.3
info:
  title: LoopMarket API
  version: 0.1.0
  description: Development API. Marketplace workflows and integrations are still in
    progress.
servers:
- url: "/api"
paths:
  "/hello":
    get:
      summary: Return a greeting
      operationId: sayHello
      responses:
        '200':
          description: Greeting returned
  "/sessions":
    post:
      summary: Authenticate with the development identity provider
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Login"
      responses:
        '200':
          description: Session created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          description: Invalid credentials
        '403':
          description: No local account
        '503':
          description: Identity or session service unavailable
    delete:
      summary: Revoke the current session
      operationId: deleteSession
      security:
      - sessionBearer: []
      responses:
        '204':
          description: Session revoked
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/persons":
