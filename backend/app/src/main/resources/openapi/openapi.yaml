      description: Scoped to the authenticated seller. Creation makes a draft; updates
        require expectedVersion.
      operationId: updateListing
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListingInput"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Listing"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema: {"$ref": "#/components/schemas/Problem"}
        '404':
          description: Not found
        '409':
          description: Conflict
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    delete:
      summary: Soft-delete listing
      description: Scoped to the authenticated seller. Creation makes a draft; updates
        require expectedVersion.
      operationId: deleteListing
      security:
      - sessionBearer: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/interests":
    get:
      summary: List interests
      description: Scoped to the buyer. A published listing owned by another user
        is required.
      operationId: listInterest
      security:
      - sessionBearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: Page returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Interest"
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                    format: int64
        '400':
          description: Invalid page
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    post:
      summary: Create interest
      description: Scoped to the buyer. A publicly visible listing owned by another active user is required.
      operationId: createInterest
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InterestInput"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Interest"
        '409':
          description: Conflict
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '404':
          description: Listing is not publicly available
        '503':
          description: Authentication dependency unavailable
  "/interests/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Read interest
      description: Scoped to the buyer; historical interest remains readable after archival.
      operationId: getInterest
      security:
      - sessionBearer: []
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Interest"
        '404':
          description: Not found
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    put:
      summary: Update interest
      description: Scoped to the buyer. The original listing cannot be changed; it must
        remain published and owned by another user.
      operationId: updateInterest
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/InterestInput"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Interest"
        '404':
          description: Not found
        '409':
          description: Conflict
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    delete:
      summary: Soft-delete interest
      description: Scoped to the buyer. The listing and buyer pair remains reserved after deletion.
      operationId: deleteInterest
      security:
      - sessionBearer: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
