  "/generations":
    get:
      summary: List generations
      description: Lists the current actor's generation attempts.
      operationId: listGeneration
      security:
      - sessionBearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: Page returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Generation"
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                    format: int64
        '400':
          description: Invalid page
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    post:
      summary: Create generation
      description: Scoped to the actor. DETERMINISTIC returns stored demo suggestions without a model call. LOCAL creates a pending attempt that can be executed through the gateway. Matching retries return the existing attempt even after publication or archive; the listing must remain owned and not deleted.
      operationId: createGeneration
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GenerationCreate"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Generation"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema: {"$ref": "#/components/schemas/Problem"}
        '409':
          description: Conflict
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/generations/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Read generation
      description: Scoped to the actor. Polling an attempt still processing after 60 seconds
        marks its result UNKNOWN; it is not automatically retried.
      operationId: getGeneration
      security:
      - sessionBearer: []
      responses:
        '200':
          description: Found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Generation"
        '404':
          description: Not found
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    put:
      summary: Update generation
      description: Scoped to the actor. Only an administrator may mark a pending attempt
        FAILED or UNKNOWN.
      operationId: updateGeneration
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GenerationUpdate"
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Generation"
        '404':
          description: Not found
        '409':
          description: Conflict
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    delete:
      summary: Soft-delete generation
      description: Scoped to the actor. An attempt in progress cannot be deleted.
      operationId: deleteGeneration
      security:
      - sessionBearer: []
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/generations/{id}/execute":
    post:
      summary: Execute a pending local generation attempt
      operationId: executeLocalGeneration
      description: Claims a pending attempt before calling the gateway. Repeating this request returns the current attempt without another model call. Stale processing becomes UNKNOWN after 60 seconds; uncertain outcomes are not retried automatically.
      security:
      - sessionBearer: []
      parameters:
      - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Completed generation
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Generation"}
        '202':
          description: Attempt is already processing
          content:
            application/json:
              schema: {"$ref": "#/components/schemas/Generation"}
        '400': {description: Draft input is invalid}
        '401': {description: Session is missing or invalid}
        '404': {description: Attempt or draft is unavailable to the caller}
        '409': {description: Attempt is not local or the draft version changed}
        '503':
          description: Gateway failed; the outcome is unknown and must not be retried with this attempt.
          content:
            application/problem+json:
              schema: {"$ref": "#/components/schemas/Problem"}
              example: {type: 'about:blank', title: Service Unavailable, status: 503, detail: 'Generation is unavailable; the attempt outcome is unknown', code: GENERATION_OUTCOME_UNKNOWN}
  "/photos/{id}/content":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      summary: Upload and validate photo content
      description: Uploads a draft photo or replaces a validated photo on a draft or published listing. Rejected replacements leave the previous image available.
      operationId: uploadPhotoContent
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/PhotoContent"
      responses:
        '200':
          description: Photo validated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Photo"
        '400':
          description: Invalid image
        '413':
          description: Request exceeds the configured ingress body limit
          content:
            application/problem+json:
              schema: {"$ref": "#/components/schemas/Problem"}
        '404':
          description: Not found
        '409':
          description: Listing or photo state does not allow upload
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    get:
      summary: Read an owned validated photo
      operationId: readPhotoContent
      security:
      - sessionBearer: []
      responses:
        '200':
          description: Validated image
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: Not found
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/listings/{id}/publications":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Publish a complete draft with a validated photo
      description: Repeating the same key, listing and expected version returns the original response.
        A different request with that key returns 409. Keys are retained indefinitely.
      operationId: publicationsListing
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Transition"
      responses:
        '200':
          description: Listing updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Listing"
        '400':
          description: Invalid request or missing idempotency key
          content:
            application/problem+json:
              schema: {"$ref": "#/components/schemas/Problem"}
        '404':
          description: Not found
        '409':
          description: Invalid state or version
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/listings/{id}/archives":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    post:
      summary: Archive a published listing
      operationId: archivesListing
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/Transition"
      responses:
        '200':
          description: Listing updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Listing"
        '400':
          description: Invalid request
          content:
            application/problem+json:
              schema: {"$ref": "#/components/schemas/Problem"}
        '404':
          description: Not found
        '409':
          description: Invalid state or version
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      description: Opaque session returned by POST /sessions
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: {type: string, example: 'about:blank'}
        title: {type: string, example: Bad Request}
        status: {type: integer, example: 400}
        detail: {type: string, example: Request validation failed}
        code: {type: string, description: Stable application code when available}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string, example: displayName}
              message: {type: string, example: must not be blank}
    PublicListing:
      type: object
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        description: {type: string}
        category: {type: string, enum: [OTHER, ELECTRONICS, HOME, FASHION, SPORTS, BOOKS]}
        condition: {type: string}
        city: {type: string}
        price: {type: number}
        currency: {type: string}
        sellerDisplayName: {type: string}
        createdAt: {type: string, format: date-time}
    PublicListingPage:
      type: object
      properties:
        content:
          type: array
          items: {"$ref": "#/components/schemas/PublicListing"}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}
    SellerListing:
      allOf:
      - {"$ref": "#/components/schemas/Listing"}
      - type: object
        properties:
          interestCount: {type: integer, format: int64, minimum: 0, description: Count of visible buyer interests}
    SellerListingPage:
      type: object
      properties:
        content:
          type: array
          items: {"$ref": "#/components/schemas/SellerListing"}
        page: {type: integer}
        size: {type: integer}
        total: {type: integer, format: int64}
    CurrentUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        displayName: {type: string}
        role: {type: string, enum: [USER, ADMIN]}
    SellerInterest:
      type: object
      properties:
        buyerDisplayName: {type: string}
        createdAt: {type: string, format: date-time}
    Login:
      type: object
      example: {username: luke.skywalker, password: force-1977}
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Session:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
    PersonInput:
      type: object
      required:
      - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    AccountInput:
      type: object
      required:
      - personId
      - issuer
      - externalSubject
      - role
      properties:
        personId:
          type: string
          format: uuid
        issuer:
          type: string
        externalSubject:
          type: string
        role:
          type: string
          enum:
          - USER
          - ADMIN
    ListingInput:
      type: object
      example: {title: Wooden chair, description: Oak chair with a small scratch, category: HOME, condition: USED, city: Montreal, price: 25.00, currency: CAD}
      properties:
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 10000
        category:
          type: string
          nullable: true
          enum: [OTHER, ELECTRONICS, HOME, FASHION, SPORTS, BOOKS, null]
        condition:
          type: string
          maxLength: 80
        city:
          type: string
          maxLength: 120
        price:
          type: number
          minimum: 0
          maximum: 9999999999.99
          multipleOf: 0.01
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
        expectedVersion:
          type: integer
          format: int64
    InterestInput:
      type: object
      required:
      - listingId
      properties:
        listingId:
          type: string
          format: uuid
    PhotoInput:
      type: object
      required:
      - listingId
      - mediaType
      - byteSize
      properties:
        listingId:
          type: string
          format: uuid
        mediaType:
          type: string
          enum:
          - image/jpeg
          - image/png
        byteSize:
          type: integer
          minimum: 1
          description: Maximum configured by photoMaxBytes in the backend YAML; default 20971520 bytes.
    PhotoContent:
      type: object
      required:
      - base64
      properties:
        base64:
          type: string
          format: byte
          description: Base64 encoding of an image up to photoMaxBytes; default 20971520 decoded bytes.
    Transition:
      type: object
      example: {expectedVersion: 0}
      required:
      - expectedVersion
      properties:
        expectedVersion:
          type: integer
          format: int64
          minimum: 0
    GenerationCreate:
      type: object
      example: {listingId: 01900000-0000-7000-8000-000000000001, requestKey: example-1, inputVersion: 0, clientRevision: revision-1, mode: DETERMINISTIC}
      required:
      - listingId
      - requestKey
      - inputVersion
      - clientRevision
      - mode
      properties:
        listingId:
          type: string
          format: uuid
        requestKey:
          type: string
          minLength: 1
          maxLength: 128
          description: Opaque, case-sensitive identity; trailing spaces are significant. Whitespace-only keys are invalid.
        inputVersion:
          type: integer
          format: int64
          minimum: 0
        clientRevision:
          type: string
          minLength: 1
          maxLength: 128
        mode:
          type: string
          enum: [DETERMINISTIC, LOCAL]
          description: DETERMINISTIC produces a demo result; LOCAL creates a pending attempt for gateway execution.
    GenerationUpdate:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - FAILED
          - UNKNOWN
    Person:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        displayName:
          type: string
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        personId:
          type: string
          format: uuid
        issuer:
          type: string
        externalSubject:
          type: string
        role:
          type: string
    Listing:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        sellerId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        category:
          type: string
          nullable: true
          enum: [OTHER, ELECTRONICS, HOME, FASHION, SPORTS, BOOKS, null]
        condition:
          type: string
        city:
          type: string
        price:
          type: number
        currency:
          type: string
        status:
          type: string
        version:
          type: integer
          format: int64
    Interest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        listingId:
          type: string
          format: uuid
        buyerId:
          type: string
          format: uuid
    Photo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        listingId:
          type: string
          format: uuid
        mediaType:
          type: string
        byteSize:
          type: integer
          format: int64
        validationStatus:
          type: string
    Generation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        listingId:
          type: string
          format: uuid
        actorId:
          type: string
          format: uuid
        requestKey:
          type: string
        inputVersion:
          type: integer
          format: int64
        clientRevision:
          type: string
        mode:
          type: string
        status:
          type: string
        provider:
          type: string
          nullable: true
          description: deterministic identifies demo output without a model call.
        model:
          type: string
          nullable: true
        suggestions:
          type: object
          nullable: true
          description: Suggestions require seller review; deterministic results copy available draft fields without a model call.
          properties:
            title: {type: string, maxLength: 120}
            description: {type: string, maxLength: 3000}
            category: {type: string, enum: [OTHER, ELECTRONICS, HOME, FASHION, SPORTS, BOOKS]}
