  "/listings":
    get:
      summary: List listings
      description: Scoped to the authenticated seller. Creation makes a draft; updates
        require expectedVersion.
      operationId: listListing
      security:
      - sessionBearer: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
      responses:
        '200':
          description: Page returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  content:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Listing"
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                    format: int64
        '400':
          description: Invalid page
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
    post:
      summary: Create listing
      description: Creates a draft for the authenticated seller. Repeating the same key and
        payload returns the original response; a different payload with that key returns 409.
        Keys are retained indefinitely.
      operationId: createListing
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9._~-]+$'
      security:
      - sessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ListingInput"
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Listing"
        '400':
          description: Invalid request or missing idempotency key
          content:
            application/problem+json:
              schema: {"$ref": "#/components/schemas/Problem"}
        '409':
          description: Conflict
        '401':
          description: Session missing or invalid
        '403':
          description: Operation forbidden
        '503':
          description: Authentication dependency unavailable
  "/listings/{id}":
