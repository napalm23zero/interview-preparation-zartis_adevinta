components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      description: Opaque session returned by POST /sessions
  schemas:
    Login:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    Session:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
    PersonInput:
      type: object
      required:
      - displayName
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 120
    AccountInput:
      type: object
      required:
      - personId
      - issuer
      - externalSubject
      - role
      properties:
        personId:
          type: string
