include:
- ../../../infrastructure/.docker/dev/mysql.compose.yaml
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    networks:
    - zartis
    init: true
    ports:
    - ${DEV_BIND_ADDRESS:?}:${BACKEND_HOST_PORT:?}:${BACKEND_PORT:?}
    profiles:
    - apps
    working_dir: /workspace
    volumes:
    - ../..:/workspace
    - maven-cache:/root/.m2
    - application-logs:/var/log/zartis
    command:
    - sh
    - -c
    - >-
      mvn -B -ntp package -DskipTests &&
      exec java "-Ddw.server.applicationConnectors[0].port=$$BACKEND_PORT"
      "-Ddw.server.adminConnectors[0].port=$$BACKEND_ADMIN_PORT"
      -jar app/target/loopmarket.jar server config.yml
    environment:
      TZ: UTC
      LANG: C.UTF-8
      BACKEND_PORT: ${BACKEND_PORT:?}
      BACKEND_ADMIN_PORT: ${BACKEND_ADMIN_PORT:?}
      MYSQL_HOST: mysql
      MYSQL_PORT: ${MYSQL_PORT:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    depends_on:
      mysql:
        condition: service_healthy
networks:
  zartis:
    name: zartis
    external: true
volumes:
  maven-cache:
    external: true
    name: zartis_maven-cache
  application-logs:
    external: true
    name: zartis_application-logs
